<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>exoai — log in</title>
<meta name="description" content="exoai — log in with your license key." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07080d;
    --card:#10131f;
    --ink:#eef0ff;
    --mute:#9ea4c2;
    --dim:#5c6286;
    --line:rgba(255,255,255,.07);
    --line-2:rgba(255,255,255,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    background:
      radial-gradient(900px 500px at 85% -5%,rgba(120,130,255,.18),transparent 60%),
      radial-gradient(800px 500px at 10% 5%,rgba(140,120,255,.12),transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    font-size:15px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column;
  }
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;cursor:pointer}
  input{font:inherit;color:inherit}

  /* NAV */
  .nav{position:sticky;top:16px;z-index:80;display:flex;justify-content:center;padding:0 16px}
  .nav-inner{
    display:flex;align-items:center;gap:48px;
    padding:10px 14px;border-radius:999px;
    background:rgba(14,16,28,.72);
    border:1px solid var(--line-2);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:0 20px 40px -20px rgba(0,0,0,.6);
  }
  .brand{display:flex;align-items:center;gap:8px;padding:0 10px}
  .brand .mark{width:34px;height:16px;color:#fff}
  .brand .mark svg{display:block;width:100%;height:100%}
  .nav-links{display:flex;gap:8px}
  .nav-links a{
    padding:8px 14px;border-radius:999px;
    color:#c9cde6;font-weight:500;font-size:14.5px;
    transition:color .15s, background .15s;
  }
  .nav-links a:hover{color:#fff;background:rgba(255,255,255,.05)}
  .btn-login{
    padding:9px 22px;border-radius:999px;
    background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.08));
    border:1px solid rgba(255,255,255,.22);color:#fff;font-weight:600;font-size:14px;
  }

  /* LOGIN */
  .main{flex:1;display:grid;place-items:center;padding:60px 20px}
  .card{
    width:100%;max-width:420px;
    padding:30px 30px 28px;border-radius:20px;
    background:linear-gradient(180deg,#111422 0%,#0b0d18 100%);
    border:1px solid var(--line);
    box-shadow:0 40px 80px -30px rgba(0,0,0,.7);
  }
  .card h1{
    font-weight:400;font-size:32px;letter-spacing:-.02em;margin:0 0 6px;color:#fff;
  }
  .card .sub{color:var(--mute);font-size:14.5px;margin:0 0 24px}
  .field{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
  .field label{font-size:13px;font-weight:600;color:#d6daef;letter-spacing:.01em}
  .field input{
    width:100%;padding:14px 16px;border-radius:12px;
    background:#0a0c17;border:1px solid var(--line-2);
    color:#fff;font-size:15px;letter-spacing:.02em;
    outline:none;transition:border-color .15s, box-shadow .15s;
  }
  .field input::placeholder{color:#5c6286;letter-spacing:.1em;font-weight:500}
  .field input:focus{
    border-color:rgba(140,150,255,.5);
    box-shadow:0 0 0 4px rgba(140,150,255,.14);
  }
  .btn-submit{
    width:100%;padding:15px;border-radius:999px;
    background:linear-gradient(100deg,#8a90ff 0%,#6b73ff 32%,#525dde 58%,#8b92ff 100%);
    border:1px solid rgba(255,255,255,.22);
    box-shadow:0 14px 40px -12px rgba(100,110,255,.65),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -8px 20px rgba(0,0,0,.25);
    color:#fff;font-weight:600;font-size:15.5px;
    transition:filter .15s, transform .1s;
  }
  .btn-submit:hover{filter:brightness(1.08)}
  .btn-submit:active{transform:translateY(1px)}
  .hint{
    text-align:center;color:var(--mute);font-size:13.5px;margin-top:22px;
  }
  .hint a{color:#aab0ff;font-weight:600}
  .hint a:hover{color:#c6cbff}

  /* FOOTER */
  footer{padding:30px 0 24px;border-top:1px solid var(--line);color:var(--dim);font-size:12.5px;text-align:center}

  @media (max-width:640px){
    .nav-links{display:none}
    .card{padding:26px 22px 24px}
    .card h1{font-size:28px}
  }
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html" aria-label="exoai">
      <span class="mark">
        <svg viewBox="0 0 60 30" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M48 6 C 42 2, 22 2, 16 8 C 11 13, 15 18, 25 18 C 33 18, 42 18, 42 22 C 42 26, 32 28, 22 26 C 16 25, 12 24, 10 22"
                fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
    </a>
    <nav class="nav-links">
      <a href="index.html#top">Home</a>
      <a href="index.html#features">Features</a>
      <a href="index.html#pricing">Pricing</a>
    </nav>
    <a class="btn-login" href="login.html">Login</a>
  </div>
</header>

<main class="main">
  <form class="card" onsubmit="event.preventDefault();document.getElementById('key').focus();">
    <h1>Log in</h1>
    <p class="sub">Enter your license key to continue.</p>
    <div class="field">
      <label for="key">License key</label>
      <input id="key" name="key" type="text" placeholder="EX-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false"/>
    </div>
    <button type="submit" class="btn-submit">Log in</button>
    <div class="hint">Don't have a key? <a href="index.html#pricing">Purchase</a></div>
  </form>
</main>

<footer>&copy; 2026 exoai. All rights reserved.</footer>

</body>
</html>
